<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn identity verification journey</title>
  <desc id="desc">A visual flow showing LinkedIn to Persona to OneID to Monzo, back to OneID, then a failed handoff to eID Easy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ED0FF"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="700" rx="28" fill="#14181f"/>

  <text x="90" y="95" fill="#F2F4F7" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="46" font-weight="650">
    One task. Six handoffs.
  </text>
  <text x="90" y="142" fill="#B1BDCD" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24">
    The verification succeeds at the bank, then fails during the final provider handoff.
  </text>

  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif">
    <!-- arrows -->
    <g stroke="#8ED0FF" stroke-width="5" fill="none" marker-end="url(#arrow)" opacity="0.95">
      <path d="M270 365 H350"/>
      <path d="M510 365 H590"/>
      <path d="M750 365 H830"/>
      <path d="M990 365 H1070"/>
      <path d="M1230 365 H1310"/>
    </g>

    <!-- cards -->
    <g filter="url(#shadow)">
      <rect x="90" y="275" width="180" height="180" rx="18" fill="#191F28" stroke="#334152"/>
      <rect x="350" y="275" width="160" height="180" rx="18" fill="#191F28" stroke="#334152"/>
      <rect x="590" y="275" width="160" height="180" rx="18" fill="#191F28" stroke="#334152"/>
      <rect x="830" y="275" width="160" height="180" rx="18" fill="#191F28" stroke="#334152"/>
      <rect x="1070" y="275" width="160" height="180" rx="18" fill="#191F28" stroke="#334152"/>
      <rect x="1310" y="275" width="200" height="180" rx="18" fill="#202733" stroke="#FF8A8A" stroke-width="2"/>
    </g>

    <!-- success dots -->
    <g>
      <circle cx="180" cy="320" r="14" fill="#8ED0FF"/>
      <circle cx="430" cy="320" r="14" fill="#8ED0FF"/>
      <circle cx="670" cy="320" r="14" fill="#8ED0FF"/>
      <circle cx="910" cy="320" r="14" fill="#8ED0FF"/>
      <circle cx="1150" cy="320" r="14" fill="#8ED0FF"/>
      <circle cx="1410" cy="320" r="14" fill="#FF8A8A"/>
    </g>

    <g fill="#F2F4F7" font-size="27" font-weight="650" text-anchor="middle">
      <text x="180" y="374">LinkedIn</text>
      <text x="430" y="374">Persona</text>
      <text x="670" y="374">OneID</text>
      <text x="910" y="374">Monzo</text>
      <text x="1150" y="374">OneID</text>
      <text x="1410" y="374">eID Easy</text>
    </g>

    <g fill="#B1BDCD" font-size="18" text-anchor="middle">
      <text x="180" y="407">Start verification</text>
      <text x="430" y="407">Choose method</text>
      <text x="670" y="407">Bank identity</text>
      <text x="910" y="407">Authentication</text>
      <text x="1150" y="407">Share details</text>
      <text x="1410" y="407">Final handoff</text>
    </g>

    <g font-size="16" font-weight="650" text-anchor="middle">
      <text x="180" y="438" fill="#8ED0FF">CONTINUE</text>
      <text x="430" y="438" fill="#8ED0FF">CONTINUE</text>
      <text x="670" y="438" fill="#8ED0FF">CONTINUE</text>
      <text x="910" y="438" fill="#8ED0FF">SUCCESS</text>
      <text x="1150" y="438" fill="#8ED0FF">SUCCESS</text>
      <text x="1410" y="438" fill="#FF8A8A">ERROR</text>
    </g>

    <rect x="90" y="530" width="1420" height="92" rx="14" fill="#191F28" stroke="#334152"/>
    <text x="120" y="570" fill="#8ED0FF" font-size="18" font-weight="700">UX failure point</text>
    <text x="120" y="601" fill="#D6DEE8" font-size="21">
      The user is verified by Monzo and returned to OneID, but the onward handoff fails with a generic error.
    </text>
  </g>
</svg>