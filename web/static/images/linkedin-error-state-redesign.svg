<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Current versus improved identity verification error state</title>
  <desc id="desc">A comparison between a vague generic error and an improved error message that explains what succeeded, what failed, and what the user can do next.</desc>

  <rect width="1600" height="900" rx="28" fill="#14181F"/>

  <text x="90" y="96" fill="#F2F4F7" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="46" font-weight="650">
    Error messages should help users recover.
  </text>
  <text x="90" y="143" fill="#B1BDCD" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" font-size="24">
    The difference is not visual polish. It is useful information at the moment of failure.
  </text>

  <g font-family="Avenir Next, Segoe UI, system-ui, sans-serif">
    <!-- Left -->
    <text x="95" y="230" fill="#B1BDCD" font-size="18" font-weight="700" letter-spacing="2">CURRENT</text>
    <rect x="90" y="260" width="680" height="510" rx="20" fill="#191F28" stroke="#334152"/>
    <circle cx="160" cy="335" r="20" fill="#FF8A8A"/>
    <text x="160" y="343" fill="#14181F" font-size="24" font-weight="800" text-anchor="middle">!</text>
    <text x="205" y="342" fill="#F2F4F7" font-size="34" font-weight="650">Oops — something went wrong</text>

    <text x="140" y="415" fill="#B1BDCD" font-size="23">We couldn’t process your request right now.</text>
    <text x="140" y="475" fill="#929FB0" font-size="19">Case ID: ••••••••••••</text>

    <line x1="140" x2="720" y1="525" y2="525" stroke="#334152"/>
    <text x="140" y="578" fill="#D6DEE8" font-size="21">What failed?</text>
    <text x="690" y="578" fill="#FF8A8A" font-size="21" text-anchor="end">Unknown</text>
    <text x="140" y="625" fill="#D6DEE8" font-size="21">Was bank verification successful?</text>
    <text x="690" y="625" fill="#FF8A8A" font-size="21" text-anchor="end">Unknown</text>
    <text x="140" y="672" fill="#D6DEE8" font-size="21">What should I do next?</text>
    <text x="690" y="672" fill="#FF8A8A" font-size="21" text-anchor="end">Unknown</text>

    <!-- Right -->
    <text x="845" y="230" fill="#8ED0FF" font-size="18" font-weight="700" letter-spacing="2">IMPROVED</text>
    <rect x="840" y="260" width="670" height="510" rx="20" fill="#191F28" stroke="#8ED0FF"/>
    <circle cx="910" cy="335" r="20" fill="#8ED0FF"/>
    <path d="M900 335 l8 8 14 -18" fill="none" stroke="#14181F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="955" y="342" fill="#F2F4F7" font-size="34" font-weight="650">Your bank verification succeeded</text>

    <text x="890" y="415" fill="#D6DEE8" font-size="22">We couldn’t complete the final verification handoff.</text>
    <text x="890" y="454" fill="#B1BDCD" font-size="19">Your LinkedIn verification has not been completed.</text>

    <rect x="890" y="505" width="570" height="74" rx="12" fill="#202733" stroke="#334152"/>
    <text x="920" y="550" fill="#F2F4F7" font-size="21" font-weight="650">1. Try the handoff again</text>

    <rect x="890" y="597" width="570" height="74" rx="12" fill="#202733" stroke="#334152"/>
    <text x="920" y="642" fill="#F2F4F7" font-size="21" font-weight="650">2. Choose another verification method</text>

    <rect x="890" y="689" width="570" height="54" rx="12" fill="#8ED0FF"/>
    <text x="1175" y="724" fill="#14181F" font-size="20" font-weight="750" text-anchor="middle">Contact support with Case ID</text>

    <text x="90" y="835" fill="#8ED0FF" font-size="20" font-weight="700">DESIGN PRINCIPLE</text>
    <text x="290" y="835" fill="#D6DEE8" font-size="21">Tell the user what happened, what is safe, and what they can do next.</text>
  </g>
</svg>