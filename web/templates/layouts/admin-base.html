{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#050b18">
    <meta name="robots" content="noindex, nofollow">
    <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>

    <title>{{.Title}}</title>

    <link rel="stylesheet" href="/static/css/vanilla/main.css">
    <link rel="stylesheet" href="/static/css/vanilla/admin.css">
    <link rel="stylesheet" href="/static/css/vanilla/admin-pages.css">
    <link rel="stylesheet" href="/static/css/vanilla/admin-special.css">
    <script src="/static/scripts/min.htmx.js" defer></script>
    <link rel="icon" href="/static/favicon.svg?v=3" type="image/svg+xml" sizes="any">
</head>

<body class="admin-shell" hx-indicator="#page-progress">
    <a href="#main-content" class="skip-link">Skip to workspace</a>
    <div id="page-progress" class="htmx-indicator admin-progress" aria-hidden="true"></div>

    {{template "header" .}}

    <div id="main-content" class="admin-canvas" tabindex="-1">
        {{template "content" .}}
    </div>

    {{template "footer" .}}
</body>
</html>
{{end}}
