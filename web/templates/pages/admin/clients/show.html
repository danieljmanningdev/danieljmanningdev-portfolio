{{define "content"}}
<main class="workspace-page workspace-form-shell">
    <section class="workspace-form-header">
        <div>
            <a href="/dashboard/clients" class="button-quiet">← Back to clients</a>
            <p class="eyebrow">Client</p>
            <h1 class="workspace-form-header__title">{{.Client.Name}}</h1>
            {{if .Client.Company}}
            <p class="workspace-form-header__copy">{{.Client.Company}}</p>
            {{end}}
        </div>

        <div class="workspace-actions">
            <span class="crud-row__status">{{.Client.Status}}</span>
            <a href="/dashboard/clients/{{.Client.ID}}/edit" class="button-secondary">Edit</a>
            <button
                hx-delete="/dashboard/clients/{{.Client.ID}}"
                hx-confirm="Are you sure you want to delete this client?"
                type="button"
                class="button-secondary workspace-signout"
            >
                Delete
            </button>
        </div>
    </section>

    <section class="workspace-detail">
        <div class="workspace-detail__panel">
            <p class="metric-label">Contact</p>
            <h2 class="workspace-detail__title">Email address</h2>
            <a href="mailto:{{.Client.Email}}" class="workspace-list__detail">{{.Client.Email}}</a>
        </div>

        <div class="workspace-detail__panel">
            <p class="metric-label">Notes</p>
            <h2 class="workspace-detail__title">Client notes</h2>
            <p class="workspace-detail__copy">{{if .Client.Notes}}{{.Client.Notes}}{{else}}No notes yet.{{end}}</p>
        </div>
    </section>
</main>
{{end}}
