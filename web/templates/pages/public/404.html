{{define "content"}}
<main class="error-page">
    <section class="site-container error-page__section">
        <div class="error-page__glow" aria-hidden="true"></div>

        <div class="error-page__content">
            <p class="eyebrow">404 / Page not found</p>
            <p class="error-page__code" aria-hidden="true">404</p>
            <h1 class="error-page__title">
                That page is no longer
                <span class="error-page__accent">at this address.</span>
            </h1>
            <p class="error-page__copy">The page may have moved, the link may be outdated, or the URL may be incorrect.</p>

            {{if .Path}}
            <p class="error-page__path">GET {{.Path}}</p>
            {{end}}

            <div class="error-page__actions">
                <a href="/" class="button-primary">Return home <span aria-hidden="true">→</span></a>
                <a href="/blog/" class="button-secondary">Open the journal</a>
            </div>
        </div>
    </section>
</main>
{{end}}
