{{define "content"}}

<div class="mx-auto max-w-3xl">

    <!-- ==================== PAGE HEADER ==================== -->

    <section class="pt-10 sm:pt-14 lg:pt-16">

        <a
            href="/dashboard/clients"
            class="inline-flex items-center text-sm text-blue-300/50 transition hover:text-white"
        >
            ← Back to clients
        </a>

        <p class="mt-10 text-xs uppercase tracking-[0.3em] text-blue-300/50">
            Clients
        </p>

        <h1 class="mt-5 text-4xl font-medium tracking-tight text-white sm:text-5xl">
            Add client
        </h1>

        <p class="mt-5 max-w-2xl text-base leading-7 text-blue-100/50">
            Create a client record with their contact details and any useful notes.
        </p>

    </section>


    <!-- ==================== FORM ==================== -->

    <section class="mt-12 pb-16">

        <form
            method="post"
            action="/dashboard/clients/new"
            class="rounded-3xl border border-blue-400/10 bg-blue-950/20 p-7 shadow-2xl shadow-black/10 sm:p-9"
        >

            <div class="space-y-8">

                <div>

                    <label
                        for="name"
                        class="block text-sm font-medium text-blue-100/70"
                    >
                        Name
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        value="{{.Name}}"
                        required
                        autocomplete="name"
                        class="mt-3 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                        placeholder="Client name"
                    >

                </div>


                <div>

                    <label
                        for="email"
                        class="block text-sm font-medium text-blue-100/70"
                    >
                        Email
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        value="{{.Email}}"
                        required
                        autocomplete="email"
                        class="mt-3 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                        placeholder="client@example.com"
                    >

                </div>


                <div>

                    <label
                        for="company"
                        class="block text-sm font-medium text-blue-100/70"
                    >
                        Company
                    </label>

                    <input
                        id="company"
                        name="company"
                        type="text"
                        value="{{.Company}}"
                        autocomplete="organization"
                        class="mt-3 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                        placeholder="Company name"
                    >

                </div>


                <div>

                    <label
                        for="notes"
                        class="block text-sm font-medium text-blue-100/70"
                    >
                        Notes
                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        rows="7"
                        class="mt-3 block w-full resize-y rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                        placeholder="Anything useful about this client..."
                    >{{.Notes}}</textarea>

                </div>

            </div>


            <div class="mt-9 flex flex-col-reverse gap-3 border-t border-blue-400/10 pt-7 sm:flex-row sm:items-center sm:justify-end">

                <a
                    href="/dashboard/clients"
                    class="inline-flex items-center justify-center rounded-full border border-blue-400/10 px-5 py-3.5 text-sm font-medium text-blue-100/60 transition hover:border-blue-400/20 hover:text-white"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="inline-flex items-center justify-center rounded-full bg-blue-500 px-6 py-3.5 text-sm font-medium text-[#050B18] transition hover:bg-blue-400"
                >
                    Create client
                </button>

            </div>

        </form>

    </section>

</div>

{{end}}
