{{define "robots"}}
<meta
    name="robots"
    content="noindex, nofollow"
>
{{end}}

{{define "content"}}

{{define "content"}}
<main class="relative overflow-hidden">
    <div
        class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(59,130,246,0.14),transparent_48%)]"
    ></div>

    <section
        class="relative mx-auto flex min-h-[calc(100vh-9rem)] w-full max-w-7xl items-center justify-center px-6 py-16 lg:px-8"
    >
        <div class="w-full max-w-xl">
            <div
                class="rounded-4xl border border-blue-400/10 bg-white/[0.035] p-8 shadow-2xl shadow-black/25 backdrop-blur-xl sm:p-12"
            >
                <div class="mb-10">
                    <p
                        class="mb-4 text-xs font-semibold uppercase tracking-[0.32em] text-blue-300"
                    >
                        Private workspace
                    </p>

                    <h1
                        class="text-4xl font-semibold tracking-tight text-white sm:text-5xl"
                    >
                        Admin sign in
                    </h1>

                    <p
                        class="mt-4 max-w-lg text-base leading-7 text-slate-400"
                    >
                        Sign in to access the internal client, project and contract workspace.
                    </p>
                </div>

                {{if .Error}}
                <div
                    role="alert"
                    class="mb-7 rounded-2xl border border-red-400/20 bg-red-400/10 px-5 py-4 text-sm text-red-200"
                >
                    {{.Error}}
                </div>
                {{end}}

                <form
                    action="/login"
                    method="post"
                    class="space-y-7"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{.CSRFToken}}"
                    >
                    <div>
                        <label
                            for="email"
                            class="mb-2.5 block text-sm font-medium text-slate-200"
                        >
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            required
                            value="{{.Email}}"
                            class="w-full rounded-2xl border border-white/10 bg-white/4.5 px-5 py-4 text-base text-white outline-none transition placeholder:text-slate-600 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/10"
                            placeholder="you@example.com"
                        >
                    </div>

                    <div>
                        <label
                            for="password"
                            class="mb-2.5 block text-sm font-medium text-slate-200"
                        >
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="w-full rounded-2xl border border-white/10 bg-white/4.5 px-5 py-4 text-base text-white outline-none transition placeholder:text-slate-600 focus:border-blue-400/50 focus:ring-2 focus:ring-blue-400/10"
                            placeholder="Your password"
                        >
                    </div>

                    <button
                        type="submit"
                        class="inline-flex w-full items-center justify-center rounded-2xl bg-blue-500 px-6 py-4 text-base font-semibold text-white transition hover:bg-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400/50"
                    >
                        Sign in
                    </button>
                </form>

                <div
                    class="mt-8 border-t border-white/5 pt-6"
                >
                    <p
                        class="text-center text-sm leading-6 text-slate-500"
                    >
                        Restricted to authorised administrative access.
                    </p>
                </div>
            </div>
        </div>
    </section>
</main>
{{end}}
