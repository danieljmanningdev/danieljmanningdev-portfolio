{{define "content"}}

<div class="mx-auto max-w-4xl">

    <div class="mb-10">
        <a
            href="/dashboard/clients/{{.Client.ID}}"
            class="inline-flex items-center text-sm text-blue-300/60 transition hover:text-white"
        >
            ← Back to client
        </a>

        <p class="mt-10 text-xs uppercase tracking-[0.3em] text-blue-300/50">
            Clients
        </p>

        <h1 class="mt-4 text-4xl font-medium tracking-tight text-white sm:text-5xl">
            Edit client
        </h1>

        <p class="mt-4 max-w-2xl text-base leading-7 text-blue-100/50">
            Update this client's contact details and internal notes.
        </p>
    </div>

    {{if .Error}}
        <div class="mb-6 rounded-2xl border border-red-400/20 bg-red-500/10 px-5 py-4 text-sm text-red-200">
            {{.Error}}
        </div>
    {{end}}

    <form
        method="post"
        action="/dashboard/clients/{{.Client.ID}}"
        class="rounded-3xl border border-blue-400/10 bg-blue-950/20 p-6 shadow-2xl shadow-black/10 sm:p-8"
    >

        <div class="space-y-7">

            <div>
                <label
                    for="name"
                    class="block text-sm font-medium text-blue-100/70"
                >
                    Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    value="{{.Client.Name}}"
                    required
                    autocomplete="name"
                    class="mt-2 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                    placeholder="Client name"
                >
            </div>

            <div>
                <label
                    for="email"
                    class="block text-sm font-medium text-blue-100/70"
                >
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    value="{{.Client.Email}}"
                    required
                    autocomplete="email"
                    class="mt-2 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                    placeholder="client@example.com"
                >
            </div>

            <div>
                <label
                    for="company"
                    class="block text-sm font-medium text-blue-100/70"
                >
                    Company
                </label>

                <input
                    id="company"
                    name="company"
                    type="text"
                    value="{{.Client.Company}}"
                    autocomplete="organization"
                    class="mt-2 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                    placeholder="Company name"
                >
            </div>

            <div>
                <label
                    for="status"
                    class="block text-sm font-medium text-blue-100/70"
                >
                    Status
                </label>

                <select
                    id="status"
                    name="status"
                    class="mt-2 block w-full rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                >
                    <option value="active" {{if eq .Client.Status "active"}}selected{{end}}>
                        Active
                    </option>

                    <option value="inactive" {{if eq .Client.Status "inactive"}}selected{{end}}>
                        Inactive
                    </option>
                </select>
            </div>

            <div>
                <label
                    for="notes"
                    class="block text-sm font-medium text-blue-100/70"
                >
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="6"
                    class="mt-2 block w-full resize-y rounded-2xl border border-blue-400/10 bg-[#071127] px-4 py-3.5 text-white placeholder:text-blue-100/20 outline-none transition focus:border-blue-400/40 focus:ring-2 focus:ring-blue-400/10"
                    placeholder="Anything useful about this client..."
                >{{.Client.Notes}}</textarea>
            </div>

        </div>

        <div class="mt-8 flex flex-col-reverse gap-3 border-t border-blue-400/10 pt-6 sm:flex-row sm:items-center sm:justify-end">

            <a
                href="/dashboard/clients/{{.Client.ID}}"
                class="inline-flex items-center justify-center rounded-full border border-blue-400/10 px-5 py-3 text-sm font-medium text-blue-100/60 transition hover:border-blue-400/20 hover:text-white"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="inline-flex items-center justify-center rounded-full bg-blue-500 px-6 py-3 text-sm font-medium text-[#050B18] transition hover:bg-blue-400"
            >
                Save changes
            </button>

        </div>

    </form>

</div>

{{end}}
