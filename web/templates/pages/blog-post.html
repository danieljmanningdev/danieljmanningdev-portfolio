{{ define "content" }}

<main class="mx-auto w-full max-w-4xl px-6 py-20 sm:px-8 lg:py-24">

    <article>

        <header class="border-b border-blue-400/10 pb-10">

            <a
                href="/blog/"
                class="text-sm text-blue-200/50 transition hover:text-white"
            >
                ← Back to journal
            </a>

            {{ with .Post.PublishedAt }}
            <time
                class="mt-10 block text-xs uppercase tracking-[0.2em] text-blue-200/40"
            >
                {{ .Format "02 January 2006" }}
            </time>
            {{ end }}

            <h1
                class="mt-4 text-4xl font-semibold tracking-tight text-white sm:text-5xl lg:text-6xl"
            >
                {{ .Post.Title }}
            </h1>

            {{ if .Post.Excerpt }}
            <p
                class="mt-6 max-w-2xl text-lg leading-8 text-blue-100/50"
            >
                {{ .Post.Excerpt }}
            </p>
            {{ end }}

        </header>

        <div
            class="
                mt-12
                max-w-3xl
                text-base
                leading-8
                text-blue-50/80

                [&_h1]:mt-12
                [&_h1]:text-3xl
                [&_h1]:font-semibold
                [&_h1]:text-white

                [&_h2]:mt-12
                [&_h2]:text-2xl
                [&_h2]:font-semibold
                [&_h2]:text-white

                [&_h3]:mt-10
                [&_h3]:text-xl
                [&_h3]:font-semibold
                [&_h3]:text-white

                [&_p]:mt-6

                [&_ul]:mt-6
                [&_ul]:list-disc
                [&_ul]:space-y-2
                [&_ul]:pl-6

                [&_ol]:mt-6
                [&_ol]:list-decimal
                [&_ol]:space-y-2
                [&_ol]:pl-6

                [&_strong]:font-semibold
                [&_strong]:text-white

                [&_a]:text-blue-300
                [&_a]:underline
                [&_a]:underline-offset-4

                [&_code]:rounded
                [&_code]:bg-blue-400/10
                [&_code]:px-1.5
                [&_code]:py-0.5
                [&_code]:text-sm

                [&_pre]:mt-6
                [&_pre]:overflow-x-auto
                [&_pre]:rounded-lg
                [&_pre]:border
                [&_pre]:border-blue-400/10
                [&_pre]:bg-blue-400/5
                [&_pre]:p-5

                [&_pre_code]:bg-transparent
                [&_pre_code]:p-0
            "
        >
            {{ .ContentHTML }}
        </div>

    </article>

</main>

{{ end }}
