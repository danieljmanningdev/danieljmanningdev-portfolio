{{define "content"}}

<div class="mx-auto max-w-7xl">

    <div class="flex flex-col gap-8 pt-8 sm:flex-row sm:items-end sm:justify-between">

        <div>
            <p class="text-xs uppercase tracking-[0.3em] text-blue-300/50">
                Dashboard
            </p>

            <h1 class="mt-4 text-4xl font-medium tracking-tight text-white sm:text-5xl">
                Clients
            </h1>

            <p class="mt-4 max-w-2xl text-base leading-7 text-blue-100/50">
                Manage your client relationships and contact details.
            </p>
        </div>

        <a
            href="/dashboard/clients/new"
            class="inline-flex shrink-0 items-center justify-center rounded-full bg-blue-500 px-6 py-3 text-sm font-medium text-[#050B18] transition hover:bg-blue-400"
        >
            Add client
        </a>

    </div>

    <div class="mt-12 overflow-hidden rounded-3xl border border-blue-400/10 bg-blue-950/20">

        {{if .Clients}}

            <div class="divide-y divide-blue-400/10">

                {{range .Clients}}

                    <a
                        href="/dashboard/clients/{{.ID}}"
                        class="block p-6 transition hover:bg-blue-400/5 sm:p-7"
                    >

                        <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">

                            <div class="min-w-0">

                                <h2 class="text-lg font-medium text-white">
                                    {{.Name}}
                                </h2>

                                <p class="mt-2 truncate text-sm text-blue-100/50">
                                    {{.Email}}
                                </p>

                                {{if .Company}}
                                    <p class="mt-2 text-sm text-blue-100/30">
                                        {{.Company}}
                                    </p>
                                {{end}}

                            </div>

                            <span class="inline-flex w-fit shrink-0 rounded-full bg-blue-400/10 px-3 py-1 text-xs text-blue-200/60">
                                {{.Status}}
                            </span>

                        </div>

                    </a>

                {{end}}

            </div>

        {{else}}

            <div class="p-10 text-center sm:p-14">

                <p class="text-sm text-blue-100/40">
                    No clients yet.
                </p>

                <a
                    href="/dashboard/clients/new"
                    class="mt-5 inline-flex text-sm text-blue-400 transition hover:text-blue-300"
                >
                    Add your first client →
                </a>

            </div>

        {{end}}

    </div>

</div>

{{end}}
