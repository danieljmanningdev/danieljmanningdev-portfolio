#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"

  # Your Go entrypoint lives here
  cmd = "go build -o ./tmp/main ./cmd/server"

  # Faster feedback for UI work
  delay = 200

  entrypoint = ["./tmp/main"]

  exclude_dir = [
    ".git",
    "tmp",
    "vendor",
    "testdata",
    "node_modules"
  ]

  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""

  include_dir = []

  # Watch your actual frontend files too
  include_ext = [
    "go",
    "tpl",
    "tmpl",
    "html",
    "css",
    "js",
    "svg"
  ]

  include_file = []

  kill_delay = "500ms"
  log = "build-errors.log"

  poll = false
  poll_interval = 0

  post_cmd = []
  pre_cmd = []

  rerun = false
  rerun_delay = 500

  send_interrupt = true

  # Don't silently continue using an old binary if the new build fails
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

# Air has built-in browser live reload
[proxy]
  enabled = true

  # Your Go server
  app_port = 8080

  # Open THIS in Chrome
  proxy_port = 8090

  # Give your app a moment to restart
  app_start_timeout = 10000

[screen]
  clear_on_rebuild = false
  keep_scroll = true