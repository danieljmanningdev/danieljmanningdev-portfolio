name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Test, vet and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'The following Go files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test ./...

      - name: Build production image
        run: docker build --tag portfolio-ci .

      - name: Smoke-test production image and non-root process
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 portfolio-ci)"

          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done

          if [ "$healthy" != "true" ]; then
            echo "Production container did not become healthy"
            exit 1
          fi

          docker exec "$container_id" sh -c '
            while read -r key real_uid remaining; do
              if [ "$key" = "Uid:" ]; then
                echo "PID 1 UID: $real_uid"
                [ "$real_uid" = "10001" ]
                exit
              fi
            done < /proc/1/status
            exit 1
          '