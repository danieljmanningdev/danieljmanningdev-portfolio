name: Add verified author headers

on:
  push:
    branches:
      - author-comments
    paths:
      - .github/workflows/add-author-headers.yml

permissions:
  contents: write

jobs:
  add-author-headers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out author-comments
        uses: actions/checkout@v4
        with:
          ref: author-comments
          fetch-depth: 0

      - name: Prepend author headers file by file
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          header = (
              "// -----------------------------------------------------------------------------\n"
              "// Daniel J. Manning\n"
              "// https://danieljmanningdev.com\n"
              "//\n"
              "// Copyright © 2026 Daniel J. Manning.\n"
              "// -----------------------------------------------------------------------------\n"
              "\n"
          ).encode("utf-8")

          bom = b"\xef\xbb\xbf"
          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.go"]
          ).split(b"\0")

          modified: list[str] = []
          generated: list[str] = []
          existing: list[str] = []

          for raw_path in tracked:
              if not raw_path:
                  continue

              path = Path(raw_path.decode("utf-8"))
              original = path.read_bytes()

              if b"Code generated" in original[:2048] and b"DO NOT EDIT." in original[:2048]:
                  generated.append(path.as_posix())
                  continue

              prefix = bom if original.startswith(bom) else b""
              body = original[len(prefix):]
              package_index = body.find(b"package ")
              preamble_end = package_index if package_index >= 0 else min(len(body), 2048)
              preamble = body[:preamble_end]

              has_header = all(
                  marker in preamble
                  for marker in (
                      b"Daniel J. Manning",
                      b"danieljmanningdev.com",
                      b"Copyright",
                  )
              )
              if has_header:
                  existing.append(path.as_posix())
                  continue

              updated = prefix + header + body
              path.write_bytes(updated)

              if path.read_bytes() != updated:
                  raise RuntimeError(f"failed to write exact header patch: {path}")

              modified.append(path.as_posix())

          Path("/tmp/author-header-files.txt").write_text(
              "\n".join(modified) + ("\n" if modified else ""),
              encoding="utf-8",
          )

          print(f"Patched: {len(modified)}")
          print(f"Already headed: {len(existing)}")
          print(f"Generated and skipped: {len(generated)}")
          for path in modified:
              print(f"  + {path}")
          PY

      - name: Verify every patch preserves the original file
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess

          header = (
              "// -----------------------------------------------------------------------------\n"
              "// Daniel J. Manning\n"
              "// https://danieljmanningdev.com\n"
              "//\n"
              "// Copyright © 2026 Daniel J. Manning.\n"
              "// -----------------------------------------------------------------------------\n"
              "\n"
          ).encode("utf-8")
          bom = b"\xef\xbb\xbf"

          manifest = Path("/tmp/author-header-files.txt")
          paths = [
              line
              for line in manifest.read_text(encoding="utf-8").splitlines()
              if line
          ]

          for path in paths:
              original = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              prefix = bom if original.startswith(bom) else b""
              expected = prefix + header + original[len(prefix):]
              actual = Path(path).read_bytes()

              if actual != expected:
                  raise RuntimeError(
                      f"preservation check failed for {path}: "
                      "the result is not exactly header + original bytes"
                  )

          numstat = subprocess.check_output(
              ["git", "diff", "--numstat", "--", "*.go"],
              text=True,
          ).splitlines()

          changed = set()
          for line in numstat:
              additions, deletions, path = line.split("\t", 2)
              if additions != "7" or deletions != "0":
                  raise RuntimeError(
                      f"unexpected diff for {path}: "
                      f"+{additions}/-{deletions}; expected +7/-0"
                  )
              changed.add(path)

          if changed != set(paths):
              raise RuntimeError(
                  "manifest and Git diff disagree: "
                  f"manifest={sorted(paths)}, diff={sorted(changed)}"
              )

          subprocess.run(["git", "diff", "--check"], check=True)
          print(f"Verified {len(paths)} byte-preserving, additions-only patches.")
          PY

      - name: Run Go tests and static analysis
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Commit verified patches
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.go'
          git rm --quiet .github/workflows/add-author-headers.yml
          git diff --cached --check

          git commit -m "chore: add author headers to Go source files"
          git push origin HEAD:author-comments
