name: Review source snapshot
on:
  push:
    branches: ['improvement/portfolio-quality-review']
    paths: ['.github/workflows/review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output="$RUNNER_TEMP/review-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-source
          path: ${{ runner.temp }}/review-source.zip
          retention-days: 3
