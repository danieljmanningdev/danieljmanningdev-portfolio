name: Portfolio quality review

on:
  push:
    branches:
      - 'improvement/**'

permissions:
  contents: read

concurrency:
  group: quality-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated review batch
        if: github.ref == 'refs/heads/improvement/portfolio-quality-review'
        run: |
          if [ -f .review/next.patch ]; then
            count="$(git apply --numstat .review/next.patch | wc -l)"
            test "$count" -le 10
            git apply --check --whitespace=error-all .review/next.patch
            git apply --index --whitespace=error-all .review/next.patch
            echo "Review batch changes $count files"
            git diff --cached --stat
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          git diff --check
          git diff --cached --check

      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...

      - name: Build isolated review executables
        run: |
          mkdir -p review-bin
          CGO_ENABLED=0 go build -trimpath -o review-bin/server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o review-bin/adminctl ./cmd/adminctl

      - name: Save review executables
        uses: actions/upload-artifact@v4
        with:
          name: review-bin-${{ github.sha }}
          path: review-bin/
          retention-days: 3

      - name: Check reachable known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Commit validated review batch
        if: github.ref == 'refs/heads/improvement/portfolio-quality-review'
        run: |
          if [ -f .review/next.patch ]; then
            git rm .review/next.patch
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: apply validated portfolio quality batch'
            git push origin HEAD:refs/heads/improvement/portfolio-quality-review
          fi

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7
