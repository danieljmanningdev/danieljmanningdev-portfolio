name: Portfolio quality review

on:
  push:
    branches:
      - 'improvement/**'

permissions:
  contents: read

concurrency:
  group: quality-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          git diff --check

      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...

      - name: Build isolated review executables
        run: |
          mkdir -p review-bin
          CGO_ENABLED=0 go build -trimpath -o review-bin/server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o review-bin/adminctl ./cmd/adminctl

      - name: Save review executables
        uses: actions/upload-artifact@v4
        with:
          name: review-bin-${{ github.sha }}
          path: review-bin/
          retention-days: 3

      - name: Check reachable known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-coverage-${{ github.sha }}
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7
