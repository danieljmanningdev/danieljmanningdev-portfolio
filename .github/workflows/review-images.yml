name: Isolated review image batches

on:
  push:
    branches: ['improvement/portfolio-quality-review']
    paths:
      - '.github/workflows/review-images.yml'

permissions:
  contents: write

concurrency:
  group: isolated-review-images
  cancel-in-progress: false

jobs:
  images:
    if: github.ref == 'refs/heads/improvement/portfolio-quality-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Convert, verify, test and commit each bounded batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-reports"
          for batch in social lossless-0 lossless-1; do
            echo "::group::Image batch $batch"
            python scripts/build_responsive_images.py "$batch" | tee "$RUNNER_TEMP/image-reports/$batch.json"
            git add web/static/images/
            count="$(git diff --cached --name-only | wc -l)"
            test "$count" -le 7
            test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
            git diff --cached --check
            go vet ./...
            go test -race ./...
            go build ./...
            govulncheck ./...
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "perf: validate $batch image batch"
              git push origin HEAD:refs/heads/improvement/portfolio-quality-review
            fi
            echo "::endgroup::"
          done

      - name: Save generated assets and byte measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-optimised-images
          path: |
            web/static/images/
            ${{ runner.temp }}/image-reports/
          retention-days: 7
